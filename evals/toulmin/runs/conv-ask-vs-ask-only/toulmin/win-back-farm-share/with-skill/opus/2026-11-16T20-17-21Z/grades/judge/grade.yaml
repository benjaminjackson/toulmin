      (roughly $74), or the survey result as 29 of 41, so the reader never sees what
      the new credit is actually worth.'
    right_comparison: Last year is described honestly as the thing being fixed, but
      the email never compares signing up with not signing up, and the 52 remaining
      shares are stated without any sense of how fast they're going.
    qualification: The more-than-a-third credit rule and the plain statement that
      loss can't be ruled out are concrete and something a member could check, though
      it doesn't say who decides a box was cut or how the credit is paid.
    objections: The two complaints, that the farm went quiet and paid nothing back,
      are each met with a specific promise, but the obvious follow-up about any credit
      for last year's thin boxes goes unanswered.
    fit: It's a short, clear email under 200 words, but it leaves out the website
