    right_comparison: The only comparison is a generic one, 'most crowdfunding games
      are promises'; it never weighs the reader's real choices, such as waiting for
      retail or what happens to their money if the project slips.
    qualification: The only hedge is 'if that date changes, I'll tell you', which
      the reader can't check; the writer left out the available promise of a full
      refund if delivery is more than three months past November and the update every
      two weeks.
    objections: 'It answers the first-timer worry with finished assets, a signed quote
      and a full-time-job schedule, but it omits the facts that would answer it best:
