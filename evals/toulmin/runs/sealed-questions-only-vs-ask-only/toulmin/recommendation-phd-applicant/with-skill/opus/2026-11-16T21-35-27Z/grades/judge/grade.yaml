      is a mild forecast the facts barely support, and 'few full-time undergraduates
      could keep up that schedule' is an unbacked aside.
    works_the_facts: 'It repeats the raw figures (90 trips, 14 months, 6 sites, top
      of 28) but never works them out, for example roughly six trips a month for over
      a year, and it leaves out the strongest number the writer had: about 40 letters
      written in 17 years, with 2 students told she could not write a strong one.'
    right_comparison: '''One of the three best students'' has no stated pool behind
