      a larger operation (4 vets, 14 staff) than the job she's applying for (3 dentists,
      9 staff).
    right_comparison: The letter never sets her clinic's size against Brookside's
      and never speaks to what the owner faces if the post stays empty, so the comparisons
      that favour her go unstated.
