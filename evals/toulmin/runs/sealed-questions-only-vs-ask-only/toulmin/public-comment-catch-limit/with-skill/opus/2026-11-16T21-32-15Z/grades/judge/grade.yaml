      worse'' (the survey and the 2016 drop measure different things).'
    works_the_facts: It correctly turns the 32 lost trips into about $29,000, but
      it leaves the survey as a raw 41 of 70 instead of 59%, and it skips the total
      two-year loss (47 trips, about $42,000) and the 19% drop.
    right_comparison: It describes the 2016 recovery path fairly and compares charter
      landings with private landings, but it gives no facts on how the alternatives
      would affect the stock compared with the 2-fish cut.
    qualification: The captains' 'if bookings fall like 2016' condition and the offer
      of logs and an app test point toward something checkable, but there's no review
      date, no booking threshold and no stated consequence if the alternative falls
      short.
    objections: 'It handles ''you dispute our science'' and ''charters are a small
      share'' well, but it leaves open the main objection: whether 3 fish cuts the
      catch enough.'
