    agree: The speech is credible and accepts the staff's numbers, but it never shows
      that 3 fish or a shorter season would do the conservation job, so commissioners
      who trust their staff have little reason to depart from the recommendation.
    honest: 'It honestly drops the claim that every boat will close, but three lines
      go past the brief: ''I never got back to 170'' (the brief stops at 155), ''Either
