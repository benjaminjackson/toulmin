task:
  name: staff-office-days
  type: staff-announcement
  set: sealed
  reader: The firm's 46 architects and designers. About a third were hired as fully
    remote in 2021 and 2022, some live more than two hours away, and several have
    said in reviews that remote work is the main reason they stay. They decide whether
    to go along with the change, push back, or leave.
  prompt: 'I need to tell our staff that we''re ending fully remote work. I''m one
    of the three partners at an architecture firm with 46 architects and designers.


    What I can say:

    - From September 1, everyone works in the office on Tuesday, Wednesday and Thursday.

    - 15 of our people were hired as fully remote in 2021 and 2022. 4 of them live
    more than two hours from the office.

    - Those 4 can keep working remotely until the end of next year. After that, they
    come in once a week.

    - Last year we lost two large hospital projects in the final interview. Both clients
    told us our team seemed not to know each other.

    - Based on our review records, junior staff hired since 2022 are taking about
    30% longer to reach the point where they lead a project.

    - The partners have been coming in one day a week. We''ll be in all three days
    too.


    Keep it to one page. It goes out by email before an all-staff meeting on Friday.'
  user_knows: '- I''m Paul Whitaker, one of the three partners.

    - The all-staff meeting is Friday at 10 a.m. in the main studio. Questions before
    it can go to me or to HR.

    - We will pay up to $150 a month toward commuting for anyone who lives more than
    30 miles away.

    - We don''t have a desk for everyone yet. New desks arrive in August.

    - 5 of our 6 project leads already come in three days a week on their own.

    - I can commit that the 4 people who live far away can keep their current setup
    to the end of next year, as stated.

    - I can commit to a review of the policy with staff after six months.

    - I cannot offer exceptions to anyone beyond those 4.'
