  details:
    agree: The letter's admission about the renovation, its budget plan and its seven
      weeks of results would carry weight with Mark, but the closing claim that the
      higher check-in scores are 'mine' cuts against his belief about the renovation
      and undoes some of that goodwill.
    honest: 'Two claims go past the facts: ''I trained most of the team now working
      the desk'' isn''t in the facts, and ''the changes that brought... check-in scores
      up are mine'' takes back the hedge made earlier in the letter.'
    works_the_facts: 'The raw numbers are restated but nothing is worked out from
      them: not that 0.3 of the 0.7-point rise came in the first 5 months, before
      the renovation, not that turnover fell from 64% to 36%, and not that training
      is 44% shorter.'
    right_comparison: Splitting the score at the start of the renovation is the right
      comparison, but the letter leaves out that the score was 8.2 just 5 months in
      and that it rose faster before the renovation than after, which is the trend
      that would counter Mark's view.
    qualification: The finance-course pledge has a deadline Mark can check, but the
      controller sessions and the Friday-wait goal have no number or date, and none
      of the pledges says what happens if it is missed.
    objections: Both of Mark's objections are faced head-on (the renovation and the
      outside candidate's larger hotel), but the reply on the renovation is weakened
      by the overclaim at the end.
    fit: It's a clear one-page letter addressed to the decision-maker, in the format
      asked for.
