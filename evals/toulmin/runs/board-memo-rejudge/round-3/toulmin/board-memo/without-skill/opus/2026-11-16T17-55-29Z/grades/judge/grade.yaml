  details:
    agree: The table of milestones, the fallback plan and the staffing plan give doubtful
      members good reasons to vote yes. But the ad-background members will still ask
      why ads can't run alongside membership, and the memo never answers that.
    honest: The memo says $131,000 was 'two years ago', which suggests the drop took
      two years when it took one. It also says ads are 'going away' and the pilot
      took 'almost no effort', which go beyond the facts. It does honestly soften
      'replace within a year' to 'annual pace by year end' and flags pilot retention
      as unknown.
    works_the_facts: 875 members, 6.25%, 1.5% and the milestone revenue figures all
      check out. But the memo never compares the pilot pace (about 35 sign-ups a week
      with no marketing) with the pace the goal needs (about 17 a week), and its ad
      projection uses the wrong rate.
    right_comparison: The 36% fall happened in one year, so at that rate ads would
      bring in about $54,000 next year, not the memo's $67,000. The memo understates
      how fast ads are falling and misses that year-one membership income ($50,000-55,000)
      would roughly equal it.
    qualification: 'The board can check dated member targets, and there is a clear
      trigger: more than 25% behind at June 30 means the director returns with named
      options.'
    objections: The memo covers the long-serving ad sales person and the year-one
      revenue gap. It does not meet the main sales-side objection, which is why give
      up $84,000 that is still coming in rather than run ads and membership together.
    fit: It is a clean board memo of about one page, though the table and the many
      placeholders push it toward running over.
