      adjusted' adds detail the brief did not give.
    works_the_facts: It gives the raw $38,000-to-$9,000 drop but never calls it a
      cut of about three-quarters, and it never points out that 4 vets and 14 staff
      is a larger operation than 3 dentists and 9 staff.
    right_comparison: It never compares the clinic she ran with the smaller practice
      she would manage, which was the obvious way to show she can handle the job.
    qualification: The Dentrix hedge rests on an unverifiable 'confident I can learn
      quickly', when it could have named the 20-hour course she has already signed
      up for and said she will finish it before her first day.
    objections: The gap is met head-on, but the doubts about recent skills, Dentrix
      readiness and availability are left open even though the church treasurer work
      in QuickBooks, the course, the two-week start and the evening hours would answer
      them.
    fit: It is a proper cover letter under 300 words, but it leaves placeholders for
