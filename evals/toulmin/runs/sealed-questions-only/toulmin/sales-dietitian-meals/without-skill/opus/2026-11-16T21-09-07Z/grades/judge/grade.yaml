      changes weren't tracked; the only soft spot is the unsupported claim that the
      meals 'taste good'.
    works_the_facts: 'The figures are reported accurately but barely worked: 37 of
      88 isn''t turned into roughly 42% staying past six months, the full plan isn''t
      given as about $12.90 per meal, and the trial isn''t shown as a cheaper per-meal
      test.'
    right_comparison: The alternative is a generic picture of counting carbs and reading
      labels, not the reader's actual history of starting and dropping apps and services,
      which the retention data could have answered directly.
