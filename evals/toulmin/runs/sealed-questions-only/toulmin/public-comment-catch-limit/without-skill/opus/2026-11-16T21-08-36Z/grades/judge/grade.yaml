  details:
    agree: Accepting the staff's numbers and asking for alternatives is the right
      approach for commissioners who trust their staff, but the draft never shows
      that a three-fish limit or a separate for-hire limit would still rebuild the
      stock, so a resisting commissioner has little reason to change their vote.
    honest: It drops the false claim that every boat will close, but 'multiply that
      across 11 boats' applies one captain's 2016 loss to the whole harbor, 'never
      got all the way back' goes beyond the two-year figure, and the tackle-shop,
      fuel-dock and restaurant effects are not in the facts.
    works_the_facts: It works out the 2016 loss as nearly one trip in five and about
      $27,000, but it leaves the survey at 41 of 70 instead of nearly 60%, and it
      doesn't show that the cut lands on a small share of the catch while a large
      share of one boat's income is at stake.
    right_comparison: It honestly reports the partial recovery to 155 trips, but it
      sets the 9% charter share against the 80% private share as if the bag limit
      fell only on charters, when it applies to all anglers.
    qualification: 'The commission gets nothing it can check: the captain''s offer
      of trip logs from 2016 on and the association''s offer to test a catch-reporting
      app are left out, and the yearly-review idea has no date or trigger attached.'
    objections: It deals with the trust-the-staff objection by accepting the stock
      numbers, but it doesn't answer 'you recovered last time' or 'will the alternative
      meet the target', and it proposes a for-hire limit and annual review the captain
      never agreed to while leaving out the shorter season he did accept.
    fit: At about 340 words it fits a two-minute public comment and is well paced
      for speaking aloud, though it leaves [NAME] and [HARBOR] as placeholders even
      though the captain's name is known.
