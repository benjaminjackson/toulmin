    agree: The concession on the science and the 2016 figures make the comment credible,
      but commissioners who trust staff get no stock-based reason to take three fish
      over two and none of the captain's concrete offers (trip logs, a reporting-app
      trial), so most would stay with staff.
    honest: It correctly drops the unsupported claim that every boat will close, and
      its figures are accurate, but 'never fully recovered' stretches the brief's
      single two-year data point, 'a private angler still goes fishing' is asserted
      without support, and the separate for-hire limit is an ask the captain never
      named.
    works_the_facts: It derives the 19% drop and the roughly $29,000 loss correctly,
      but leaves the 41 of 70 as raw counts rather than 'nearly 6 in 10', and never
      states the boat's roughly $144,000 season revenue or the harbor-wide stake.
    right_comparison: It sets the charter fleet's 9% against private boats' 80%, but
      never says how little cutting the charter limit adds to rebuilding the stock,
      or what a three-fish limit or shorter season would do to the 78% figure.
    qualification: The one-year review has no metric, threshold or consequence tied
      to it, and the comment does not offer the trip logs or app trial that would
      give the commission something to check.
    objections: It heads off the 'you're attacking our science' objection, but not
      the obvious ones that a charter group's own customer survey is self-serving
      and that his bookings came back after 2016, both of which the logs offer and
      the 70%-booked fact could have helped answer.
    fit: At about 340 words it fits a two-minute public comment and is built for speaking,
      though it leaves [NAME] and [HARBOR] placeholders where the captain's name and
      boat were available.
