  details:
    agree: The warm case and the 'half of last time' framing would interest a reader
      who loves the cinema, but someone who remembers the refunds and just gave $200
      elsewhere gets no promise about what happens to their money, no suggested amount
      and no reopening date, so they would likely give little or wait.
    honest: The figures are accurate, but 'secured a 10-year lease' and 'We have the
      people and the lease' overstate a lease that the owner only offers if the $85,000
      is raised.
    works_the_facts: It works out the $60,000 public share and the comparison with
      last time, but it leaves out the $11,000 already pledged, so it shows a $13,000
      gap over last time's $47,000 when the true remaining need of $49,000 is only
      $2,000 more.
    right_comparison: It shows the alternative accurately (a 38-mile drive and a closed
      cinema that was still selling 180 tickets a week), but it gives no sense of
      what that drive costs or whether things get worse if nothing is done.
    qualification: June 30 is named as the bank's condition, but there is no year,
      no statement that pledges are returned in full if the goal is missed, and no
      mention that the roof estimate could rise by up to 15%.
    objections: It raises the failed first campaign but answers it only with a smaller
      goal, leaving out the all-or-nothing guarantee and the quarterly spending reports
      that would directly answer the worry that this will end in refunds again.
    fit: It is a pitch of about 330 words with a sensible structure, but the [Cinema
      Name] placeholders appear even though the name (the Majestic on Main Street)
      was available, and the campaign dates are missing.
