      are invented embellishments, and 'shipping costs are worked out' with no figures
      reads as more settled than the brief shows.
    works_the_facts: 'It never derives the numbers this reader cares about: about
      572 backers needed at $49, a factory cost near $30 a copy plus $9 shipping,
      the leftover margin after fees, or the fact that the goal needs nearly half
      of the 1,240 sign-ups to pledge.'
    right_comparison: 'It gives no honest comparison: nothing about what happens if
      the campaign falls short, or how a 23-rating BGG score compares with established
      games, and it hints at a big-studio contrast without developing it.'
    qualification: A first-time creator's campaign needs checkable hedges, such as
      a delivery month, a quote expiry and what happens if costs rise, and the draft
      offers only a vague promise of regular updates.
    objections: It admits this is a first game but never answers the real worry about
      fulfillment, even though the brief's factory quote and shipping figures could
      have shown in concrete terms that the goal covers delivery.
    fit: It is a pitch-page draft of about 500 words with suitable headers, though
