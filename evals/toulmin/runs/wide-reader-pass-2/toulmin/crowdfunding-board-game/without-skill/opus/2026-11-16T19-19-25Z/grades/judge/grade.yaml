    agree: The theme and the playtest record would interest this backer, but someone
      who lost $85 on a game that never shipped gets no budget breakdown, no delivery
      date and no risk plan, so they would probably wait instead of pledging.
    honest: The draft rightly drops the 'proven hit' claim the creator asked for,
