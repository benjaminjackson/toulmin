  details:
    agree: Comparing the $49,000 still needed with the $47,000 the town pledged last
      time, and saying plainly that this campaign is all-or-nothing, would probably
      persuade a wary former donor to pledge something, though nothing helps them
      decide how much.
    honest: Saying 'most of the money has already been pledged' is false, since $36,000
      of $85,000 is 42%, and 'People will come' and the claim that door takings go
      to films and the building are stated more firmly than the facts allow.
    works_the_facts: The $49,000 remainder and the '$2,000 more than last time' comparison
      are derived well, but the 180 tickets a week is never turned into a yearly figure
      (about 9,400) and the effect of the 15% roof rise is never costed.
    right_comparison: 'It shows what happens if nothing changes: the screen stays
      dark and the nearest cinema stays 38 miles away, and it contrasts this with
      ten years of $1 rent, though it repeats the 38 miles instead of making that
      alternative more concrete.'
    qualification: The all-or-nothing deadline of June 30 is specific and checkable,
      but the caveat that the roof could cost up to 15% more has no dollar figure
      and doesn't say what happens if it does.
    objections: The worry left by the first campaign's refunds is met head-on, but
      the reader who has just given to the ambulance fund gets no reason why this
      is worth a second gift, and raising the roof overrun without a plan creates
      a new doubt.
    fit: It reads as a proper campaign pitch with a clear ask and a signature, but
      at roughly 355 words it is at or just over the 350-word limit.
