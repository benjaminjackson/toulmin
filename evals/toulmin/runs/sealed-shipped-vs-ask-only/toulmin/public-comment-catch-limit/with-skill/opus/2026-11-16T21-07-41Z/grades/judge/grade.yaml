    agree: Accepting the staff's stock numbers and asking for a 3-fish limit or shorter
      season makes this captain more credible than most, but the draft offers nothing
      the commission can check, such as the 2016-on trip logs or the reporting-app
      trial, so a commissioner who trusts staff has little reason to vote against
      them.
    honest: It rightly drops the 'every boat out of business' claim, but 'charter
      boats land the least flounder in this state' and the claim that private anglers
      only get 'a shorter day on the water' go beyond the 9%/80% figures, and $80,000
      over three years ignores the recovery after 2016.
    works_the_facts: The 'almost one in five' drop and the roughly $27,000-a-season
      loss are fair figures from the brief, but the three-year total multiplies the
      worst year instead of following the 2016 recovery, the survey is left as raw
      counts rather than 59%, and the 70% of this season already booked goes unused.
    right_comparison: It shows the 2016 drop and the partial recovery to 155 and notes
      that bookings never fully came back, but then projects a full three years at
      the worst-year loss, which contradicts the trend it just described.
    qualification: The only condition is 'if a 3-fish limit or a shorter season can
      get the stock where it needs to be', with no number, date, or check, and it
      leaves out the commitments (trip logs, app trial) that would give the commission
      something to verify.
    objections: It heads off the stock-science objection and the 'you recovered last
      time' objection, but it never addresses whether a 3-fish limit meets staff's
      target, and the 9% share cuts both ways without comment.
    fit: At about 330 words it is roughly a two-minute spoken comment in plain sentences,
      but it never gives the speaker's name or boat, which a public comment normally
      states.
