task:
  name: negotiation-lease-renewal
  type: negotiation-email
  set: sealed
  reader: The landlord who owns the small strip of shops where the restaurant sits. He waived the late fees twice when the restaurant paid rent late in early 2024 and still brings it up, and a coffee chain has asked him about the space. He decides what rent to offer and whether to renew at all.
  prompt: 'Help me answer my landlord. I own a 40-seat Vietnamese restaurant, and my 5-year lease ends in August. He wants to raise the rent from $4,800 a month to $5,650, which is about 18%.


    Facts:

    - I''ve been in the space for 10 years, over two leases.

    - I paid rent late twice in early 2024, by 11 days and by 19 days. He waived the late fees both times. I''ve paid on time every month since.

    - I put about $70,000 into the kitchen in 2019, including a new hood system that stays with the building.

    - The empty unit two doors down has been for lease for 14 months at $28 a square foot a year. His number works out to about $29 for my space.

    - I can pay $5,100 a month if I get a 5-year lease, with 3% increases each year after the first.

    - He told me a coffee chain asked about my space.


    Keep it short and polite, under 300 words.'
  user_knows: '- The restaurant is Pho Lan. The landlord is Frank Halloran.

    - Rent was late in early 2024 because our walk-in cooler failed and we were closed for 9 days.

    - A new tenant would pay about $40,000 to put in a hood system like the one I installed.

    - Our sales are about 6% lower this year than last year.

    - I can commit to signing a 5-year lease within two weeks of agreeing on terms.

    - I can commit to paying rent by automatic bank transfer on the 1st of each month.

    - I cannot pay $5,650 a month and keep the restaurant open.

    - I want his answer before June 1, so I have time to plan before August.'
