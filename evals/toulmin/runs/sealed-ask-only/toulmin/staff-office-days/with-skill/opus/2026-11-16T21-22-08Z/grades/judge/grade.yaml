      for the commuting subsidy appears nowhere in the facts given.
    works_the_facts: 'The 30% figure is never turned into something concrete, such
      as months of lost growth, and two useful facts go unused: 5 of 6 project leads
      already come in three days, and 15 of 46 means about a third of staff were hired
      remote.'
    right_comparison: The status quo is shown fairly through the lost bids and slower
      junior development, but there is no trend and no sense of what keeps happening
      if nothing changes.
    qualification: The six-month review has no date (around March 2028), no measure
      of success, and no consequence, so the reader cannot hold the firm to it.
    objections: The broken hiring terms and commuting costs are addressed, but 'why
      three days and not fewer?' is not, and readers will ask whether there are desks
      for everyone, a question the August desk delivery already answers but the email
      leaves out.
    fit: It is a one-page email set before the meeting as asked, but it leaves out
