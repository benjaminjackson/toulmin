      her.'
    right_comparison: The only comparison is 'among the most ambitious' of 30 theses,
      which is weaker than the user's 'one of the 3 best students in 17 years', the
      benchmark a skeptical reader needs.
    qualification: The hedge about publication names real limits (the storm gap and
