      moved' implies a trend that one higher fee and an agent's range don't quite
      show.
    works_the_facts: It uses the given numbers correctly and notes that $11,500 is
      below the $12,500 she was paid elsewhere, but it derives nothing further, such
      as the flat fee across six books or the fourth printing's value to the publisher.
    right_comparison: It compares her fee with the market range and the other publisher,
      but it never sets her proven sales and reading-list record against the real
      alternative, an untested illustrator at a lower fee.
    qualification: The firm 'not at $9,000' line has no checkable conditions around
      it, and it leaves out the sketch date, the September 1 final-art date and the
      reply-by-next-week deadline that would make the offer concrete.
    objections: The editor's main objections, the fixed budget and the cheaper newcomer,
      are never addressed, and the free spot drawings and schedule commitments that
      could answer them are left out.
    fit: It is a polite email of about 210 words, within the 250-word limit, though
