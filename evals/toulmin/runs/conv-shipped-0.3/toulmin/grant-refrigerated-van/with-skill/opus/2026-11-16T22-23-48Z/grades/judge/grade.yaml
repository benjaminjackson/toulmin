      quarterly pound reports, but it sets no target number, no date by which the
      farms should give, and no consequence if they don't.
    objections: It meets the late-report objection head-on with a named owner and
      dates. It then raises its own objection, the unfunded $4,500 a year, and leaves
      it unanswered.
    fit: This is a grant narrative of about 420 words, well under the 500-word limit,
