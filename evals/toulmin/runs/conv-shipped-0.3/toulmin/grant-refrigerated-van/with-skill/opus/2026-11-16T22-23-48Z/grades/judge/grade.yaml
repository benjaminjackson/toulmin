      to run the van has no source, which leaves a reason to hesitate before recommending
      yes.'
    honest: The draft drops the unsupported 'double' claim and correctly states 50
      percent more fresh food in harvest months; the only stretch is 'signed up' and
      'committed' for volunteers who had only said they would drive.
    works_the_facts: It works out 3,000 pounds a month and the 50 percent seasonal
      increase, and correctly calls $18,000 more than a quarter of the cost. It never
      gives the annual effect (about 12.5 percent), never asks how long $11,000 in
      reserves covers $4,500 a year in running costs, and never says what the van
      does outside harvest season.
    right_comparison: 'The alternative is stated plainly and accurately: without a
