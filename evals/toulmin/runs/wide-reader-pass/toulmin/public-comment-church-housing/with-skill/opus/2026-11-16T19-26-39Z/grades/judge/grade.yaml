      doesn't shrink the cost of 310 trips or the drop to a D grade, so neighbours
      who oppose the project are unlikely to change their minds.
    honest: The numbers are accurate, but the speech calls it 'the county's traffic
      study' when the brief says only 'the traffic study', and 'wait a little longer'
      plays down the drop from C to D without any figure to back it.
    works_the_facts: It works out that 64 homes is roughly one for every six households
      on the waiting list and that 72 spaces leaves 8 spare, but it doesn't break
      310 daily trips into a per-hour rush-hour figure that would sound smaller, and
      it doesn't show what share of the 2,100-home shortfall this project covers.
    right_comparison: The 'if you say no' paragraph sets out the alternative clearly
      with the brief's own numbers, though 'the waiting list stays at 412' treats
      a figure that changes as fixed, and the brief gives no trend to support that.
    qualification: The offer to back 'conditions to improve Alder and 4th' is a useful
      hedge, but it names no measure, no target grade, no date and nothing that happens
      if the target is missed.
    objections: The speech takes on the traffic objection head-on and admits the speaker
      pays the cost too, and covering parking with the 72-space figure is reasonable
      for this audience, but it accepts the traffic cost without making it any smaller.
    fit: At about 430 words in short, speakable lines, it fits a three-minute public
