  details:
    agree: Opening with traffic and admitting the D rating builds credibility with
      the two traffic-focused commissioners, but the only reply to it is "I'll take
      a longer wait over what we have now," which is too thin to move them or the
      opposed neighbours.
    honest: The figures match the brief and are rounded fairly ("almost two acres,"
      "about one in six"), though "I drive Alder every day" is a small personal detail
      the brief doesn't give.
    works_the_facts: It works out the eight spare parking spaces and the one-in-six
      share of the waiting list, but it leaves 310 trips a day as a raw total instead
      of breaking it into something smaller, such as trips per hour or per unit, and
      it doesn't put the 3-year wait or the 2,100-home gap into terms of pace.
    right_comparison: 'The alternative is described plainly and truthfully: a lot
      that sits empty six days a week and 412 households who keep waiting, which is
      as far as the facts in the brief go.'
    qualification: The offer to approve on condition of a signal review at Alder and
      Fourth is a reasonable hedge, but it gives no level of service to meet, no deadline
      and no consequence if the review fails, so the commission has nothing it can
      check.
    objections: Traffic, the main objection, is raised first and honestly, and parking
      is answered with the 72-space figure, but the traffic answer is an appeal to
      preference rather than an attempt to reduce the impact.
    fit: At about 420 words of spoken first-person address with a clear request at
      the end, it fits a 3-minute slot, apart from the awkward line "here's what we
      have now."
