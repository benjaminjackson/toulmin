      goes a bit beyond the facts.
    works_the_facts: It works out four fewer leavers and four fewer training shifts
      per hire, but it never turns turnover into rates (64% to 36%) or shows the yearly
      saving (about 81 training shifts down to 25), which would be the strongest true
      version of the payroll point.
    right_comparison: The before-and-after for turnover and training is accurate,
      but the outside hire is described only as someone who "would need months to
      learn" the hotel, with nothing about their experience running a larger front
      desk.
    qualification: 'The budget plan can be checked: a 90-day line-by-line review,
      monthly labor-cost reports and a written explanation for any overrun, but the
      only consequence of going over budget is an explanation, and no target number
      is named.'
    objections: It deals directly with the renovation doubt and the missing budget
      experience, but it leaves the outside candidate's larger-hotel experience unanswered,
      which is the GM's other main reservation.
    fit: It's a short, one-page memo with clear headings, which suits a written application
