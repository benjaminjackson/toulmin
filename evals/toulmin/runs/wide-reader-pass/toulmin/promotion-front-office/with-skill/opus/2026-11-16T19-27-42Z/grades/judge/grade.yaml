      the payroll point.'
    right_comparison: The memo describes the outside alternative as someone starting
      from scratch while the job stays open, but the GM is already interviewing an
      experienced front desk manager from a larger hotel, so that picture doesn't
      match the facts.
    qualification: The six-month plan of monthly reviews against budget gives the
      GM something to check and a time frame, but it sets no variance threshold and
      says nothing about what happens if payroll goes off track.
