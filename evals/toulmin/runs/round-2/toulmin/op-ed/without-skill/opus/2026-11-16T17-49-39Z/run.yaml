task:
  name: op-ed
  reader: A reader of the local paper who is a parent in the district or a member
    of the school board that votes on April 14. This reader has heard the athletic
    director's objections and knows parents who drop their children off on the way
    to 8 a.m. shifts. The reader decides whether to support the later start time.
  prompt: 'I''m a school nurse at a public high school and I want to write an op-ed
    for our local paper before the school board votes on April 14 on moving the high
    school start time from 7:25 to 8:30.


    What I''ve got:

    - Last fall I logged 412 visits to my office during first period: headaches, kids
    falling asleep, stomach complaints. That''s more than second and third period
    put together (198 and 171).

    - In a survey our health class ran, 640 of the 890 students who answered said
    they sleep under 7 hours on school nights.

    - A district two counties over moved to 8:30 three years ago. Their first-period
    tardies dropped 31%, and their superintendent told our board that attendance went
    up "about a point."

    - Our four-year graduation rate is 84%.

    - The American Academy of Pediatrics recommends that high schools start no earlier
    than 8:30.

    - The athletic director says practices would end after dark from November on and
    away games would mean missed last-period classes. A lot of parents drop their
    kids off on the way to 8 a.m. shifts. The district says the bus contract would
    cost an extra $180,000 a year.


    I want the piece to say that a later start will raise our graduation rate. 650
    words max.'
