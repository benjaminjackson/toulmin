  details:
    agree: The calm tone, three specific requests and concrete offers in return make
      action easy for a manager who thinks things went well, although the letter sets
      no reply deadline, so she could slow-walk it.
    honest: Most claims are faithful to the facts, but the brief doesn't support "We
      have not been given a reason for the delay" or "not aware of any help offered."
      Saying all 23 residents over 75 "can't leave their homes" also goes further
      than the facts allow.
    works_the_facts: '"One day in every eight" is a good derived figure, but the letter
      never says the part promised for August is now five months overdue, and it doesn''t
      present 74 of 112 as two-thirds of households.'
    right_comparison: It describes the no-change alternative concretely as "August
      again" and supports it with the repeated six-to-eight-week promise, though it
      doesn't spell out how often the outages recur.
    qualification: The hedge on the second elevator ("we are not engineers") is honest
      and asks for a written assessment the reader can check, but none of the requests
      comes with a date or a consequence if it isn't met.
    objections: It answers the passing inspection certificate and the $400,000 objection
      directly, and the 74 signatures quietly rebut the idea that the association
      is a few loud people, without raising objections the facts already settle.
    fit: It's a properly addressed open letter of about 430 words, dated for posting
      on the 1st and suitable for both the lobby and the press.
