      'nothing has to be re-quoted' quietly assumes backers stay under 1,500.
    works_the_facts: It derives about 570 backers needed, shows that half the 1,240
      sign-ups would clear the goal, and notes the run is nearly three times the need,
      but it never puts the roughly $25.3k cost against the $28k goal, so 'small cushion'
      can't be checked, and it leaves out the 90k-subscriber review.
    right_comparison: Putting 570 needed against 1,240 signed up is a fair benchmark,
      but nothing compares the game with other options and there's no trend to read.
    qualification: November 2027 is given as the expected date, but nothing says what
      happens if it's missed, even though a full refund after three months late was
      available.
    objections: It names the first-time-creator worry and answers it with the signed
      quote and costs, but it leaves out the refund guarantee and the update every
      two weeks, which are the answers this reader most needs.
    fit: At about 520 words it's close to the length asked for and well organised,
