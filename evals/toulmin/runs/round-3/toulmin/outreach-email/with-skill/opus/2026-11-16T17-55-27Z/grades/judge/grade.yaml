  details:
    agree: Opening with her own $600K quote and putting the $75K cost next to a $120K
      conservative saving gives Dana a concrete reason to take a call, though she
      gets little to bring to an IT director who resists change.
    honest: Every number checks out ($75K, ~20%, ~$120K, 'more than half'), but 'Even
      our smaller result' implies only two results exist when only two of six customers
      report numbers and one won't share, and 'That's the problem we solve' claims
      more than that thin evidence supports.
    works_the_facts: It works out the annual cost for five sites and the conservative
      saving, but it skips the strongest true figure, a 54% cut worth roughly $320K
      a year against $75K, and never states the payback.
    right_comparison: The alternative is her own stated $600K a year in returns continuing,
      which matches the facts, and the brief gives no trend to describe.
    qualification: The only hedge is 'see whether your numbers would look like theirs',
      which has no checkpoint, date, threshold or consequence (for example, a pilot
      measured at month three with an exit if errors don't fall).
    objections: Saying it doesn't replace or change the warehouse system and takes
      three weeks does address the IT worry, but it never says what IT has to do,
      whether it touches integrations, or how Dana could put it to her IT director.
    fit: It's short, the paragraphs are easy to read on a phone, and the subject line
      and closing ask suit a cold email.
