  details:
    agree: Opening with Dana's own $600K quote and a specific before-and-after result
      could earn a reply, but the email never shows the savings next to the cost,
      and it never tells the IT director how little his team would have to do.
    honest: It wisely leaves out the claim that errors were "cut in half" across customers
      and gives only the one customer's numbers, but it presents that best case without
      saying it's the best one, and it ends by suggesting her numbers could move "the
      same way" when the only other reported result was 2.8 to 2.2.
    works_the_facts: 'It derives nothing from the figures: no 54% reduction, no estimate
      that the same drop would save roughly $320K of her $600K, and no comparison
      with about $75K a year for five sites.'
    right_comparison: It names the $600K a year she loses now, but it never sets that
      ongoing loss against the price or the likely savings, so doing nothing never
      looks like the costlier choice.
    qualification: Results ranged from a 54% drop to a 21% drop, so a hedge was needed,
      but the only one is the vague "whether your numbers could move the same way",
      with no range, no checkpoint and no consequence if the target is missed.
    objections: '"Doesn''t replace your WMS, sits on top of it" and the three-week
      setup partly answer the IT director''s resistance, but the email doesn''t say
      what IT would actually have to do or whether the existing system is touched
      at all.'
    fit: It is short, the paragraphs are easy to read on a phone and it ends with
      a clear request for a call, as the brief asked.
