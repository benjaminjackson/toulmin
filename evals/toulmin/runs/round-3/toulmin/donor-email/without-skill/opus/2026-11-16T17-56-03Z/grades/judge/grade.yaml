  details:
    agree: The match and the $575-equals-a-year figure are concrete reasons to give,
      but a reader still angry about Eastside gets an apology without a reason to
      trust the school again, so many would stay lapsed.
    honest: The email correctly drops the brief's unsupportable promise that every
      waiting child gets a place, and every figure it uses comes from the brief, though
      'every child we fund comes off the waiting list' is a circular line that only
      sounds like a promise.
    works_the_facts: The $85-to-$170 and $575-to-$1,150 conversions are good, but
      the email never works out that the full list costs $70,150 or that a fully used
      match ($30,000 total) would fund about 26 of the 61 children.
    right_comparison: It never says what happens if the reader does not give (children
      stay on the list, the match goes unclaimed), and it gives no sense of the shortfall
      against last year's $1,240.
    qualification: The $15,000 cap and the December 31 deadline are stated and checkable,
      but 'until the match runs out' doesn't say that gifts after the cap go unmatched
      or how close the match is to being used up.
    objections: The Eastside closure is acknowledged with respect, but there's no
      explanation, no word on what has changed, and no link between the waiting-list
      children and the Eastside community, so the main objection is named rather than
      answered.
    fit: It's well under 250 words, set out as an email with a subject line and a
      clear call to action, and signed by the executive director as the brief asked.
