  details:
    agree: The match, the $85-becomes-$170 line and the direct mention of Eastside
      give this lapsed donor a real reason to come back, though the apology is thin
      enough that a still-angry reader may not budge.
    honest: It drops the brief's unsupportable promise that every waitlisted child
      would be placed, and every figure comes from the brief; the line that the school
      says yes only when the money is in hand is a mild, plausible inference.
    works_the_facts: Deriving $575 matched as one child's year and showing $85 doubled
      to $170 are good uses of the facts, but the email never works out the $70,150
      total need or that a fully used match (about $30,000) would fund roughly 26
      children.
    right_comparison: It never says plainly what happens without these gifts (children
      stay on the list), and it gives no sense of scale, such as how far short last
      year's $1,240 from this same group falls of the need.
    qualification: The match is limited by a date (December 31) and an amount ($15,000),
      and the January report gives the reader something to check, but the email doesn't
      say how many children the capped match can actually cover.
    objections: It names the Eastside closure and acknowledges the anger without getting
      defensive, which suits a reader who may forward it with comments, but it offers
      nothing about the closure beyond that acknowledgement.
    fit: It's a year-end email of about 210 words, under the 250 limit, signed by
      the executive director, and it rightly leaves out the guarantee the brief asked
      for because the facts can't support it.
