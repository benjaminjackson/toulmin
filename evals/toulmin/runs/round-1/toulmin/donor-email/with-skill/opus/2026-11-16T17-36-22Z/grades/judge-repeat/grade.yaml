      may take "I'm not asking you to feel differently" as a brush-off and never hear
      why the branch closed or what has changed.
    honest: 'The writer rightly drops the requested guarantee, which the facts can''t
      support: funding all 61 children costs $70,150, against at most $30,000 even
      if the match is used in full. "Every child we can fund" is true, and the only
      small embellishment is the claim that each child "has asked to learn an instrument."'
    works_the_facts: Halving $1,150 to $575 and doubling the $85 average gift to $170
      are good favourable framings, but the email never states the $70,150 total,
      how many children the $15,000 match could cover (about 26), or how far that
      is from last year's $1,240.
    right_comparison: The alternative, that the children keep waiting, is only implied
      and never measured, and the email doesn't use last year's 9 gifts to show what
      happens if giving stays at its usual level.
    qualification: The match comes with a checkable cap ($15,000) and deadline (December
      31), but "every child we can fund" doesn't say how many that is likely to be
      or what happens to the children who stay unfunded.
    objections: The email names the Eastside closure and the angry notes, which this
      reader will respect, but it neither explains the decision nor connects these
      61 children to the reader's concern, so the objection is acknowledged rather
      than answered.
    fit: It is a year-end email of about 220 words with a subject line and a call
