      gap, or the fact that even a fully used match ($30,000) places only about 26
      of the 61 children.'
    right_comparison: What happens without a gift (children keep waiting, and the
      match goes unused after December 31) is only implied, and the draft never says
      how far last year's $1,240 falls short of what is needed.
