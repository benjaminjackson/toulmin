      the brief never says, and it uses one peer newsroom to claim the model 'works
      at our scale'.
    works_the_facts: The 36% drop, 875 members, 1.5% vs 6% of the list, the pilot
      reaching a quarter of the target, roughly $50k ramped revenue and the ~$65k
      trend projection are all correctly derived from the brief, though the gap is
      measured against $84k rather than the declining figure, which overstates it.
