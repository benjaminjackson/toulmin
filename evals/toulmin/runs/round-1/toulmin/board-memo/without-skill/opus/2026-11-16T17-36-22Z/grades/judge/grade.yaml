      $65k next year rather than a flat $84k, but the gap calculation then quietly
      goes back to comparing against $84k.
    qualification: The dated member counts are checkable, and the June 30 checkpoint
      has a threshold (below 450) and a named consequence (options including restoring
      ads), though the March and December checkpoints have no consequence if missed.
    objections: The memo addresses the staffer's future, the risk of declining revenue
      and reversibility, but it doesn't answer the sales members' core 'why drop ads
      instead of adding membership' objection with anything from the facts.
    fit: It is a properly formatted board memo of about one page with a clear request
