    works_the_facts: It works out 72 percent, "one in six" not graduating on time,
      first period beating second and third combined (412 vs 369), and about $1,000
      per school day. These are fair and favourable framings, though it doesn't work
      out what one attendance point means in student-days.
    right_comparison: The status quo is shown through the visit log and the sleep
