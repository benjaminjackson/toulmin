      sleep survey, but there is no trend to show whether things are getting worse.
    qualification: The hedge on graduation is honest but gives the reader nothing
      to check, such as a tardy or attendance target, a date to review it or a consequence
      if it is missed.
    objections: 'All three objections are stated fairly, but the answers are vague:
