    honest: 'The piece rightly declines to claim that the change will raise graduation,
      but it adds things the brief did not give: ''teenagers need eight to ten,''
      the 6 a.m. wake-ups and students reporting ''five hours.'''
    works_the_facts: It derives 72 percent, 'one in six' and 412 against the 369 of
