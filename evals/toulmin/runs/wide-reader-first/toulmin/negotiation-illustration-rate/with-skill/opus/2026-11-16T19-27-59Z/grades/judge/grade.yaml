      in pay over time.
    right_comparison: It compares her flat fee with the market rate and with her growing
      record, but it doesn't spell out the trend of six books with no raise, and it
      leaves the editor to weigh the cheaper, unproven option without help.
    qualification: A fee request with a clear number needs no conditional hedge, and
      the email adds none.
    objections: The sales and reading-list record answers the 'why pay more than a
      cheaper illustrator' objection only by implication, and the email never addresses
      the publisher's fixed budget or the risk of switching to an untested artist.
