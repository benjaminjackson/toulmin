    honest: 'Several claims go beyond the brief: ''no add-on fees'', sales tax ''filed
      on time'' and ''many salons are closed then too'' are all invented, and ''almost
      always'' makes 3 missed closes in 12 months sound better than it is.'
    works_the_facts: 'Nothing is calculated: the page never gives the annual cost
      ($2,388), never sets it against the $800 savings, and never turns 29 of 31 clients
      staying or 9 of 31 clients saving money into a rate.'
    right_comparison: The only alternative described is a 'shoebox', which misrepresents
      a reader whose books already get done every year at tax time by someone she
      trusts.
    qualification: Disclosing the 3 missed closes and saying the savings aren't guaranteed
      is honest, but neither hedge tells the reader what happens when the 10th is
      missed or gives a figure she could check for her own salon.
    objections: 'The page answers questions about deadlines, client retention and
      staffing, but never takes on her real objection: why she should pay about four
      times what her cousin charges.'
    fit: At roughly 360 words with a booking button at the end, it matches the length
      and form the brief asked for.
