      the new arrangement compared with last July, so the reader has no picture of
      what is different.
    qualification: '''No farm can control the weather'' is a vague hedge with no checkable
      commitment attached, when the email could have promised credit for any week
      weather cuts a box by more than a third.'
    objections: The objection that 'you went quiet and gave nothing back' gets an
      apology but no fix, because the pause credit covers missed pickups, not weather
      losses, and the email offers no promise of regular updates.
