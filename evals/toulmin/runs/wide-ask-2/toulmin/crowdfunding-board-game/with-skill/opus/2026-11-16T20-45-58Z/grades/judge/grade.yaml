  details:
    agree: The pitch is warm and the cost breakdown is reassuring, but a backer who
      lost money once gets no delivery date, no refund promise and no update schedule,
      so they have nothing to stop them from waiting.
    honest: It rightly drops 'proven hit' and admits that 23 ratings is a small sample,
      but it invents 'many were strangers', hides that most raters played at the creator's
      own table, and says 'nothing padded in' even though about $2,650 above the 10%
      fees goes unexplained.
    works_the_facts: It works out 572 backers and the $22,550 cost at goal correctly,
      but it never puts the leftover into dollars, never compares 1,240 sign-ups to
      the 572 backers needed, and never shows the share of the 1,500-copy run that
      is already covered.
    right_comparison: Nothing describes what happens if the campaign fails, or how
      this compares with pledging to an established publisher, so the reader has nothing
      to weigh the risk against.
    qualification: This pitch needs checkable commitments, and the November delivery
      date, the full refund if delivery is more than three months late, and the update
      every two weeks are all missing.
    objections: The worry about a first-time creator gets only the surveyor analogy,
      and the facts that would actually answer it (finished art and rules, a signed
      factory quote, the reviewer's launch-week video, the refund policy) are left
      out.
    fit: It is roughly 500 words in pitch form with sensible sections, but it never
      gives the game's title, Lantern Winter, or the creator's name.
