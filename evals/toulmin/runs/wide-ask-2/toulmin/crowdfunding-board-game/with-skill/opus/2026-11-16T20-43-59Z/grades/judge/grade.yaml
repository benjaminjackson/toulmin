  details:
    agree: The open budget and the frank admission of being a first-time creator would
      win some trust, but a backer who has already lost $85 gets no delivery date,
      no refund promise and no update schedule, so they may well hold back.
    honest: It rightly avoids calling the game a 'proven hit', but it says the leftover
      $5,400 'covers' platform fees when 10% fees come to about $2,800, and it presents
      the 23 ratings as coming from real players without saying most were people who
      played at the designer's own convention table.
    works_the_facts: "Working out 572 backers and setting that against the 1,240 sign-ups\
      \ is good, but the budget is muddled: the $5,400 remainder only appears if you\
      \ work out 572 \xD7 $9 shipping yourself, and about $2,600 of it is never accounted\
      \ for."
    right_comparison: It gives an honest picture of what happens if funding falls
      short (the game stays on the designer's table), but it never sets the backer's
      choice against the risk of the game never shipping, which is the comparison
      this reader actually makes.
    qualification: There is no November delivery date, no promise of a refund if delivery
      is three months late, and no commitment to updates every two weeks, so the backer
      has nothing dated or checkable to hold the creator to.
    objections: 'It deals with the ''first-time creator'' doubt through the playtesting
      and the factory quote, but it leaves out the facts that answer the ''will it
      ever ship'' fear: the signed quote, the finished art and rules, the refund pledge,
      the update schedule and the reviewer''s launch-week video.'
    fit: It is a crowdfunding pitch of about 500 words with a hook, clear sections
      and a closing appeal, which is the form the brief asked for.
