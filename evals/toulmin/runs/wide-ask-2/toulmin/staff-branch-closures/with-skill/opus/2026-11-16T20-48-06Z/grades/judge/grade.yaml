  details:
    agree: The email is respectful and admits the change is hard, but a ten-year teller
      who doesn't want phone work gets no decision date, no named pay increase and
      no seniority shift choice, so the resisting reader is more likely to start looking
      elsewhere.
    honest: Most claims stay within the brief and the 'everyone will love it' framing
      is avoided, but 'Members will get through to us faster' is stated as certain
      when no staffing figure supports it.
    works_the_facts: The 44%, 60% and 9-minute figures are repeated but never worked,
      and the email gives no worked example of what severance comes to (say, 20 weeks
      for ten years) or of what the 8-to-8 rotation means for each person's hours.
    right_comparison: It names the falling branch visits and rising phone contacts
      as trends, but never says what keeping the branches open would lead to, so the
      reader can't weigh staying against the alternative.
    qualification: Staff facing a decision need dates and conditions, but the email
      gives no offer date, no decision deadline and no window for taking severance
      after starting the new role, and 'if you decide the new role isn't right' has
      no timing attached.
    objections: It names the counter-to-headset and 9-to-5-to-rotating-shifts concerns
      but then leaves them unanswered, with nothing on seniority-based shift choice,
      a trial period that keeps severance, or one-on-one HR meetings.
    fit: It is a COO email of roughly 400 words with a clear subject line and sections,
      but the sign-off has no name and the email doesn't name the credit union.
