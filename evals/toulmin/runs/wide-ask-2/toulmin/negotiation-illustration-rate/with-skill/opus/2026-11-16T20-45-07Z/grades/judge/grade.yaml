      sketches six weeks after signing, all of which the editor could check.
    objections: The obvious objections, 'over budget' and 'someone cheaper is available',
      go unanswered, even though the brief gives reliability, a reprinting backlist
      and free marketing spot drawings to answer them.
    fit: It is a short email under 250 words, but it has a generic greeting, no signature,
