    honest: 'The draft rightly avoids calling the game a ''proven hit'', but it adds
      unsupported claims: ''from families to veteran gamers'', ''every one of those
      sessions changed something'', ''works just as well'' solo, and ''the only way
      this game gets printed''; it also calls the raters ''early players'' rather
      than saying most of them played at the designer''s own convention table.'
    works_the_facts: 'It lists the raw figures but derives nothing from them: it never
      shows that the goal needs about 571 backers at $49 (about 46% of the 1,240 sign-ups),
      or that at the goal the costs come to about $25,300 (the $17,400 quote, about
      $5,100 shipping and about $2,800 in fees), which leaves roughly a $2,700 buffer.'
    right_comparison: The only alternative it gives is the invented claim that the
      game won't be printed without crowdfunding, and it never compares backing this
      project with the risk the reader knows from first-time campaigns that failed
      to deliver.
    qualification: The only hedge is a vague promise of 'honest updates throughout',
      with no checkable commitment such as November delivery, an update every two
      weeks, or a full refund if delivery is more than three months late.
    objections: 'It names the first-time-creator concern and mentions the factory
