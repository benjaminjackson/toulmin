  details:
    agree: A loyal editor who likes her work gets a clear, reasonable ask grounded
      in sales and market rates, but nothing helps them justify going $2,500 over
      a $9,000 budget when a newer illustrator would take $8,000.
    honest: Every figure comes from the brief, and the letter rightly leaves out the
      unsupported claim that every other publisher pays at least $12,000.
    works_the_facts: The $2,250-a-month figure is correctly derived but frames the
      fee as the illustrator's hardship rather than the publisher's gain; the letter
      never states the $2,500 rise against the value of two books that sold over 20,000
      copies, or that $11,500 is $1,000 below the $12,500 she was paid elsewhere.
    right_comparison: It shows the trend that matters to her (four years flat at $9,000
      while her market rate rose to $12,500), but it never addresses the editor's
      real alternative, a cheaper and unproven illustrator, against her proven sales
      record.
    qualification: A fee request with a single firm number needs no conditional hedge.
    objections: The editor's main objections (a fixed budget and a cheaper option)
      are only met indirectly through the sales figures, and the letter offers no
      help with the budget, such as how to make the case internally.
    fit: It is a warm, well-structured email of about 210 words, under the 250-word
      limit, with a clear subject line and ask.
