      rise as 17 points (a 41% relative gain), and about 216 hours of adult training
      delivered.'
    right_comparison: It never sets her against the obvious alternative, a candidate
      who already has GMP experience, and it doesn't say why a procedure-focused teacher
      could be the better hire.
    qualification: The 90-day onboarding review with a written proposal gives a date
      and a deliverable the reader can check, but it has no measurable target and
      doesn't say what happens if the proposal falls short.
    objections: It meets the reader's main objections, no regulated-industry experience,
      no GMP records and an unfamiliar LMS, with concrete steps like working with
      Quality before changing anything, and it doesn't raise any objection the brief
