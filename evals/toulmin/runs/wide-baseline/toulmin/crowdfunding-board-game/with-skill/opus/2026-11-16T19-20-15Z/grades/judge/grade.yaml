      take part of it.
    works_the_facts: It works out $11.60 a copy, about 572 backers, about $22,550
      for printing and shipping, and the fact that the goal covers the full run of
      1,500, and it sets the 1,240 sign-ups against the 572 backers needed, all correctly
      and in their best true form.
    right_comparison: 'It states the alternative plainly: if the goal is missed there
      is no print run. It also sets the missing sales record against the playtest
      evidence instead of inflating it.'
    qualification: Monthly updates and the all-or-nothing goal can be checked, but
      there is no delivery month and nothing on what happens if the factory quote
      or the $9 shipping estimate goes up.
    objections: It meets the first-time-creator worry head on with the quote and the
      budget, but it says nothing about fulfillment experience, cost overruns, or
      where the 928 copies beyond the backers' go, which are the risks this reader
      cares about.
    fit: It is a campaign pitch of about 500 words with clear sections and a call
